[package]
name = "puddly-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Puddly CLI — thin wrappers over library commands"
default-run = "puddly"

[[bin]]
name = "puddly"
path = "src/main.rs"

[dependencies]
clap = { workspace = true }
puddly-auth = { workspace = true }
puddly-check = { workspace = true }
puddly-core = { workspace = true }
puddly-db = { workspace = true }
puddly-diagnostics = { workspace = true }
puddly-manifest = { workspace = true }
puddly-migrate = { workspace = true }
puddly-query = { workspace = true }
puddly-rpc = { workspace = true }
puddly-server = { workspace = true }
serde_json = { workspace = true }
