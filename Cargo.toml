[workspace]
resolver = "2"
members = [
    "crates/puddly-core",
    "crates/puddly-diagnostics",
    "crates/puddly-ir",
    "crates/puddly-parse",
    "crates/puddly-validate",
    "crates/puddly-check",
    "crates/puddly-manifest",
    "crates/puddly-query",
    "crates/puddly-schema",
    "crates/puddly-migrate",
    "crates/puddly-db",
    "crates/puddly-data",
    "crates/puddly-auth",
    "crates/puddly-actions",
    "crates/puddly-rpc",
    "crates/puddly-cli",
]
default-members = ["crates/puddly-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/newFrame/newFrame"

[workspace.dependencies]
puddly-core = { path = "crates/puddly-core" }
puddly-diagnostics = { path = "crates/puddly-diagnostics" }
puddly-ir = { path = "crates/puddly-ir" }
puddly-parse = { path = "crates/puddly-parse" }
puddly-validate = { path = "crates/puddly-validate" }
puddly-check = { path = "crates/puddly-check" }
puddly-manifest = { path = "crates/puddly-manifest" }
puddly-query = { path = "crates/puddly-query" }
puddly-schema = { path = "crates/puddly-schema" }
puddly-migrate = { path = "crates/puddly-migrate" }
puddly-db = { path = "crates/puddly-db" }
puddly-data = { path = "crates/puddly-data" }
puddly-auth = { path = "crates/puddly-auth" }
puddly-actions = { path = "crates/puddly-actions" }
puddly-rpc = { path = "crates/puddly-rpc" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
walkdir = "2"
similar = "2"
insta = { version = "1", features = ["json", "yaml"] }
sha2 = "0.10"
hex = "0.4"
postgres = { version = "0.19", default-features = true }
argon2 = "0.5"
password-hash = "0.5"
rand = "0.8"
rand_core = { version = "0.6", features = ["getrandom"] }
subtle = "2"


# Oxc — pin matching versions (ADR-019)
oxc_allocator = "=0.154.0"
oxc_ast = "=0.154.0"
oxc_parser = "=0.154.0"
oxc_span = "=0.154.0"
oxc_diagnostics = "=0.154.0"
