# CI sketch: validate resources and fail if .puddly/manifest.json is stale (ADR-017).
name: puddly-check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99.1"
      # Step 9 sidecar smoke needs Node 22+ (`--experimental-strip-types`).
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate resources
        run: cargo run -p puddly-cli -- check examples/todo-slice
      - name: Fail on stale committed manifest
        run: cargo run -p puddly-cli -- manifest check examples/todo-slice
      - name: Fail on schema / migration drift
        run: cargo run -p puddly-cli -- migrate check examples/todo-slice
      - name: Unit / integration tests
        run: cargo test --workspace
      - name: Build release binary (npm pack smoke)
        run: cargo build -p puddly-cli --release --locked
      - name: npm pack + local install smoke
        working-directory: packages/puddly
        run: |
          set -euo pipefail
          PUDDLY_BINARY="${GITHUB_WORKSPACE}/target/release/puddly" npm pack
          TARBALL="$(ls -1 puddly-*.tgz | head -n1)"
          test -n "$TARBALL"
          # Install into a throwaway prefix; postinstall copies PUDDLY_BINARY → vendor/
          PREFIX="$(mktemp -d)"
          npm install -g --prefix "$PREFIX" "./${TARBALL}"
          export PATH="${PREFIX}/bin:${PATH}"
          puddly --version
          test -x "${PREFIX}/lib/node_modules/puddly/vendor/puddly"
